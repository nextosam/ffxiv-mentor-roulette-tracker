<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Duty Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="toolbar">
        <button onclick="exportToFile()" class="ffxiv-btn btn-cyan">
            <img src="assets/MainIcon35-export.png" class="btn-icon"> Export to File
        </button>
        <input type="file" id="importFile" style="display:none" onchange="importFromFile(this)">
        <button onclick="document.getElementById('importFile').click()" class="ffxiv-btn btn-gold">
            <img src="assets/MainIcon35-import.png" class="btn-icon"> Import File
        </button>
        <button class="ffxiv-btn btn-green" onclick="exportToCSV()">
            <img src="assets/MainIcon35-excel.png" class="btn-icon"> Export to Excel (CSV)
        </button>
    </div>

    <div class="picker-wrapper">
        <button class="ffxiv-btn btn-crimson picker-trigger" onclick="togglePickerConfig()">
            <img src="assets/job_picker_icon.png" class="picker-icon"> Random Job Picker
        </button>

        <div id="pickerConfig" class="picker-config hidden">
            <h3>Pick a Job Config</h3>
            <div id="configGroups"></div>
            <hr>
            <button class="roll-btn" onclick="rollJob()">ROLL!</button>
            <div id="rollResult" class="roll-result">---</div>
        </div>
    </div>

    <div class="container">
        <div class="stats-header">
            <div class="progress-section">
                <div class="progress-labels">
                    <span id="progressText">0 / 2000</span>
                    <button class="ffxiv-btn" onclick="openStats()">
                        <img src="assets/stats_icon.png" class="btn-icon"> Detailed Stats
                    </button>
                </div>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar-fill"></div>
                    <span id="percentText">0%</span>
                </div>
            </div>
        </div>
        <h1>Mentor Roulette Tracker</h1>



        <table>
            <thead>
                <tr>
                    <th>Run</th>
                    <th>Progress</th>
                    <th>Duty Type</th>
                    <th>Duty Name</th>
                    <th>Job</th>
                    <th>Clear</th>
                    <th>Timestamp</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="trackerBody">
            </tbody>
        </table>
        <div class="bottom-controls">
            <button class="add-btn-bottom" onclick="addRow()">+ Add New Entry</button>
        </div>
    </div>
    <script src="script.js"></script>

    <div id="statsModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Detailed Statistics</h2>
                <button class="close-modal" onclick="closeStats()">×</button>
            </div>
            <div id="statsBody" class="modal-body">
            </div>
        </div>
    </div>
</body>

</html>
